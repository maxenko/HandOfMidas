name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Nightly fuzz at 03:00 UTC; weekly rust-ibapi drift guard on Monday 04:00 UTC.
    - cron: '0 3 * * *'
    - cron: '0 4 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  broker:
    name: Broker workspace
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: broker
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose

  broker_ib_live_feature_lint:
    # M-31: keeps the `ib_live_tests`-gated code compile-clean even though
    # the tests themselves are NEVER run in CI (no TWS connection). The
    # feature only toggles `#[ignore]` on the test bodies in
    # `crates/midas-broker/tests/ib_live.rs`; clippy with `-D warnings`
    # under this feature flag catches drift in the live-IB-only code
    # paths. Non-blocking: `continue-on-error: true` prevents rust-ibapi
    # API-surface churn from red-walling unrelated PRs.
    name: Broker IB-live feature lint (non-blocking)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: broker
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: broker
      - name: Clippy with ib_live_tests
        run: cargo clippy -p midas-broker --features ib_live_tests --all-targets -- -D warnings

  desktop:
    name: Desktop workspace
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          workspaces: desktop/win
      - name: Format check
        run: cd desktop/win && cargo fmt --check
      - name: Clippy
        run: cd desktop/win && cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cd desktop/win && cargo build --workspace --verbose
      - name: Test
        run: cd desktop/win && cargo test --workspace --verbose

  sim_unit:
    name: IB sim unit tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sim
      - name: Test (lib only)
        run: cargo test -p midas-ib-sim --lib

  sim_integration:
    name: IB sim integration scenarios
    runs-on: ubuntu-latest
    needs: sim_unit
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sim
      - name: Test (integration)
        run: cargo test -p midas-ib-sim --test '*'

  sim_workspace:
    name: IB sim workspace checks
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sim
      - name: Format check
        run: cargo fmt -p midas-ib-sim -- --check
      - name: Clippy
        run: cargo clippy -p midas-ib-sim --all-targets -- -D warnings
      - name: Test (full crate)
        run: cargo test -p midas-ib-sim

  sim_fuzz_nightly:
    name: IB sim fuzz (nightly, decode_incoming)
    runs-on: ubuntu-latest
    # Runs only on the 03:00 UTC cron schedule — never on PR or push.
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sim-fuzz
          workspaces: |
            .
            crates/midas-ib-sim/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run decode_incoming for one hour
        working-directory: crates/midas-ib-sim
        run: cargo +nightly fuzz run decode_incoming -- -max_total_time=3600
      - name: Upload crashes (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-decode_incoming
          path: |
            crates/midas-ib-sim/fuzz/artifacts/**
            crates/midas-ib-sim/fuzz/corpus/**
          if-no-files-found: ignore

  rust_ibapi_drift:
    name: rust-ibapi HEAD drift guard
    runs-on: ubuntu-latest
    # Runs only on the weekly Monday cron schedule.
    if: github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sim-drift
      - name: Patch rust-ibapi to HEAD
        run: |
          set -euxo pipefail
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [patch.crates-io]
          ibapi = { git = "https://github.com/wboayue/rust-ibapi", branch = "main" }
          EOF
      - name: Run handshake_e2e against sim
        id: drift_test
        run: cargo test -p midas-ib-sim --test handshake_e2e
      - name: Open drift issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'rust-ibapi HEAD drift: handshake_e2e red';
            const body = [
              `Weekly drift guard failed on \`${context.sha}\`.`,
              '',
              `rust-ibapi HEAD no longer interoperates with midas-ib-sim's wire codec.`,
              `See Stage 02 version-drift strategy in \`plan/ib-sim/02-protocol-layer.md\`.`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'rust-ibapi-drift',
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['rust-ibapi-drift', 'ci'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            }
