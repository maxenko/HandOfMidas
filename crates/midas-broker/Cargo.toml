[package]
name = "midas-broker"
version = "0.1.0"
edition = "2021"

[features]
# Slice 2: enables the test-only `MarketDataSource::inject_for_test` hook on
# the router-era provider trait. Off by default; `cfg(test)` turns it on
# automatically for the crate's own tests.
test_inject = []

# Slice 4: un-ignores the live-IB integration tests in `tests/ib_live.rs`.
# The feature only toggles `#[ignore]`; compilation of the IB backend
# always happens (CI has a non-blocking clippy job that exercises it with
# this feature enabled). Requires a local TWS/IB Gateway paper session
# on port 4002 to actually run the tests.
ib_live_tests = []

[dependencies]
# Workspace crates
midas-broker-core = { path = "../midas-broker-core" }

# IB connectivity
# Pinned to =2.10 for the market-data router refactor (plan/market-data-router).
# The S1-S6 slices are coded against 2.10's exact `market_data` / historical
# surface; a separate follow-up may un-pin once 2.11+ is audited.
ibapi = "=2.10"

# Object-safe async traits (router-era `MarketDataSource` + `OrderClient`).
async-trait = "0.1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Async runtime (workspace shared)
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identity
uuid = { version = "1", features = ["v7", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
# rust-ibapi uses `time::OffsetDateTime` on its API surface; we need the
# crate for the chrono↔time bridging in `ib::translation`.
time = "0.3"

# Logging
tracing = "0.1"

# Error handling
thiserror = "2"

# Config
toml = "0.8"

# Platform directories
dirs = "5"

# Mutex without poisoning
parking_lot = "0.12"

# Concurrent map — used by the router-era IB adapter (`ib::pacing`) for
# per-identical-key token buckets and by the sim backend.
dashmap = "6"

# Random (test data generation)
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
