[package]
name = "midas-broker"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace crates
midas-core = { path = "../midas-core" }

# IB connectivity
ibapi = "2"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Async runtime (workspace shared)
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identity
uuid = { version = "1", features = ["v7", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "2"

# Config
toml = "0.8"

# Platform directories
dirs = "5"

# Random (test data generation)
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
