# Canonical daily-restart scenario.
#
# Intent: place an order, fire the 23:45 virtual disconnect, verify orders
# survive (mock engine retains order state across restart).

version: 1
name: "daily_restart"
description: "Daily restart disconnect at 23:45 virtual; orders survive."
seed: 23
clock: virtual
duration: 5min

symbols:
  - symbol: AAPL
    initial_price: 175.00

accounts:
  - acct_code: "DU1"
    starting_cash: 50000.00

events:
  - at: "00:00:02"
    do: subscribe_market_data
    args:
      symbol: AAPL
      subscription: streaming_l1

  - at: "00:00:05"
    named: submit
    do: accept_order
    args:
      order_kind: single
      side: buy
      quantity: 10
      entry: limit
      limit_price: 170.00
      symbol: AAPL
      account: DU1
      order_ref: dr-1

  - at: "00:01:00"
    do: inject_daily_restart

asserts:
  # After restart the mock engine still carries the order — the real engine
  # promises the same on reconnect. Loose shape assertion until the real
  # engine arrives; the recording pins the exact command sequence.
  - cond: "count(orders[*].status) >= 1"
    message: "at least one order survives the restart"
