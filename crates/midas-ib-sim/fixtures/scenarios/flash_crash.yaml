# Canonical flash-crash scenario.
#
# Intent: -10% price jump + halt + restore. Exercises the full chain of
# price-modification verbs.

version: 1
name: "flash_crash"
description: "-10% jump, halt, restore — chart + UI resilience."
seed: 11
clock: virtual
duration: 2min

symbols:
  - symbol: AAPL
    initial_price: 175.00

events:
  - at: "00:00:02"
    do: subscribe_market_data
    args:
      symbol: AAPL
      subscription: streaming_l1

  - at: "00:00:10"
    named: crash
    do: inject_price_jump
    args:
      symbol: AAPL
      magnitude_pct: -10.0

  - at: "00:00:11"
    do: inject_halt
    args:
      symbol: AAPL
      duration: 30s

  - after: crash
    delay: 45s
    do: inject_price_jump
    args:
      symbol: AAPL
      magnitude_pct: 2.0

asserts:
  - cond: "session_duration <= 2min"
