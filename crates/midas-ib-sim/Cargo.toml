[package]
name = "midas-ib-sim"
version = "0.1.0"
edition = "2021"
description = "Full-parity Interactive Brokers TWS gateway simulator for Hand of Midas"

[lib]
path = "src/lib.rs"

[[bin]]
name = "midas-ib-sim-server"
path = "src/bin/server.rs"

[[bin]]
name = "midas-ib-sim"
path = "src/bin/tools.rs"

[dependencies]
midas-broker-core = { path = "../midas-broker-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
async-trait = "0.1"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = { version = "0.8", features = ["chrono"] }
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
rand_chacha = "0.3"
statrs = "0.17"
static_assertions = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dbn = "0.19"
zstd = "0.13"
sha2 = "0.10"
axum = "0.7"
tower-http = { version = "0.5", features = ["limit", "timeout"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
socket2 = { version = "0.5", features = ["all"] }  # "all" unlocks TcpKeepalive::with_retries + other platform knobs
libc = "0.2"

[dev-dependencies]
proptest = "1"
tokio-test = "0.4"
rstest = "0.21"
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"
# tower::util::ServiceExt — used to drive the axum router directly in
# tests so auth-middleware behaviour is exercised end-to-end.
tower = { version = "0.4", features = ["util"] }

[[bench]]
name = "engine_realclock_single"
harness = false

[[bench]]
name = "engine_realclock_fanout"
harness = false

[[bench]]
name = "scheduler_10k_virtual"
harness = false
