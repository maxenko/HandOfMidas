[package]
name = "midas-market-data"
# Slice 5 introduces the `MarketDataRouter` — refcounted per-symbol
# fan-out hub with RAII subscription handles sitting between
# `midas-broker` (provider) and the app consumers. This crate depends
# only on `midas-broker-core` types; `midas-broker` is a dev-dep so the
# router stays independent of any concrete backend.
version = "0.1.0"
edition = "2021"

[features]
# S8d: exposes `MarketDataRouter::source_for_test()` so downstream
# test harnesses (midas-app's dev_harness InjectMarketEvent path) can
# reach the underlying provider to `inject_for_test(event)`. Forwards
# to the matching `test_inject` feature on `midas-broker-core` so the
# trait method itself stays compiled in.
test_inject = ["midas-broker-core/test_inject"]

[dependencies]
# Post-audit-P1 the provider trait + stream handles live in
# `midas-broker-core::provider`, so the router no longer needs a
# runtime dep on `midas-broker`. Integration tests still use
# `midas-broker`'s sim backend via [dev-dependencies] below.
midas-broker-core = { path = "../midas-broker-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
thiserror = "2"
futures = "0.3"
dashmap = "6"
# Direct dep so `SymbolHub`'s task-slot mutexes can use
# `parking_lot::Mutex` (no poison semantics) and drop the
# `.lock().unwrap()` pattern in the control actor. Already pulled in
# transitively via `dashmap` — make it direct for clarity.
parking_lot = "0.12"
mailbox_processor = { path = "../mailbox_processor" }
tracing = "0.1"
chrono = "0.4"

[dev-dependencies]
midas-broker = { path = "../midas-broker", features = ["test_inject"] }
tokio = { version = "1", features = ["test-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
