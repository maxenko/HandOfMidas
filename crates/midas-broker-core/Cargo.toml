[package]
name = "midas-broker-core"
# Renamed from `midas-core` to disambiguate from
# `desktop/win/crates/midas-core` (audit P3). Same name across two
# workspaces was a confusion hazard for newcomers; the rename gives
# each crate its own identity. Version stays at 0.2.0 for now —
# bump on the next breaking change.
version = "0.2.0"
edition = "2021"

[features]
# Exposes the `MarketDataSource::inject_for_test` default method for
# sim providers that want to accept synthetic events from test
# harnesses. See `provider::MarketDataSource`.
test_inject = []

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
ordered-float = { version = "4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
serde_json = "1"
toml = "0.8"
