[package]
name = "midas-core"
# Version 0.2.0 distinguishes this from desktop/win/crates/midas-core v0.1.0
# in Cargo lockfile when both are transitive deps of midas-app.
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
ordered-float = { version = "4", features = ["serde"] }
