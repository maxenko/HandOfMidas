[package]
name = "midas-workspace"
version = "0.0.0"
edition = "2021"
publish = false
# Thin root package: exists only so `tests/` integration tests can
# depend on multiple workspace crates. No library or binary is built.

[workspace]
resolver = "2"
members = [
    "crates/midas-core",
    "crates/midas-data",
    "crates/midas-indicators",
    "crates/midas-chart",
    "crates/midas-render",
    "crates/midas-feed",
    "crates/midas-ui",
    "crates/midas-grid",
    "crates/midas-app",
    "crates/midas-store",
    "crates/midas-devloop-proto",
]
default-members = ["crates/midas-app"]
exclude = ["duckdb-spike"]

[dependencies]
midas-core  = { path = "crates/midas-core" }
midas-data  = { path = "crates/midas-data" }
midas-chart = { path = "crates/midas-chart" }
midas-feed  = { path = "crates/midas-feed" }
glam        = { workspace = true }

[dev-dependencies]
tempfile = "3"
# `app_sim_e2e` integration test drives midas-app via the devloop
# TCP protocol. The test itself is `#[ignore]` by default; the deps
# here exist only for `cargo test --test app_sim_e2e -- --ignored`.
midas-devloop-proto = { path = "crates/midas-devloop-proto" }
serde_json = { workspace = true }

# S8 (session-aware-charts Phase B). Dev-deps for
# `tests/session_chart_e2e.rs`. The test body is gated on
# `#[cfg(feature = "session_chart_tests")]`; these deps get pulled in
# whenever dev-deps are resolved (integration tests), but the test
# surface is empty unless the feature is on, so the runtime cost of
# an off-feature `cargo test` is a minor compile-time increase only.
midas-app          = { path = "crates/midas-app", features = ["session_chart"] }
midas-bars         = { workspace = true }
midas-bars-adapter = { workspace = true }
midas-calendar     = { workspace = true }
midas-clock        = { workspace = true }
midas-scene        = { workspace = true }
midas-stream       = { workspace = true }
midas-axis         = { workspace = true }
midas-broker-core  = { workspace = true }
async-trait        = { workspace = true }
chrono             = { workspace = true }
tokio              = { workspace = true }
parking_lot        = { workspace = true }

[features]
default = []
# Enable the session-chart e2e integration test in `tests/`. Run with:
#   cargo test -p midas-workspace --features session_chart_tests --test session_chart_e2e
session_chart_tests = []

# ─── Workspace-wide dependency versions ───────────────────────────────
# Crates reference these via: dep = { workspace = true }
[workspace.dependencies]

# GPU rendering
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }

# GUI framework
iced = { version = "0.14", features = ["wgpu", "tokio", "advanced"] }

# Math
glam = { version = "0.29", features = ["bytemuck"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Concurrency
crossbeam = "0.8"

# Small stack-allocated vectors
smallvec = { version = "1", features = ["serde", "const_generics", "union"] }

# Data / IO
memmap2 = "0.9"

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Font rendering
ab_glyph = "0.2"
etagere = "0.2"

# Error handling
thiserror = "2"
anyhow = "1"

# Async trait support
async-trait = "0.1"

# File system
dirs = "6"
tempfile = "3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Identity
uuid = { version = "1", features = ["v7", "serde"] }

# Broker engine (root workspace crate, path dependency)
midas-broker = { path = "../../crates/midas-broker" }

# Router + per-symbol fan-out (root workspace crate, path dependency).
# Sits between midas-broker (provider) and midas-app (consumers); the
# app subscribes to ticks / bars / quotes through the router instead
# of the legacy `BrokerEvent::Tick` central match arm (S7+).
midas-market-data = { path = "../../crates/midas-market-data" }
midas-broker-core = { path = "../../crates/midas-broker-core" }

# Session-aware-charts Phase-A crates (S0..S7). The desktop workspace
# references these through `workspace.dependencies` so the Cargo feature
# `session_chart` on `midas-app` can opt them in without every other
# crate paying for the build. See plan/session-aware-charts/.
midas-bars         = { path = "../../crates/midas-bars" }
midas-bars-adapter = { path = "../../crates/midas-bars-adapter" }
midas-calendar     = { path = "../../crates/midas-calendar" }
midas-clock        = { path = "../../crates/midas-clock" }
midas-scene        = { path = "../../crates/midas-scene" }
midas-stream       = { path = "../../crates/midas-stream" }
midas-axis         = { path = "../../crates/midas-axis" }

# futures helpers (iced::futures re-exports are fine for most sites,
# but the subscription-helper streams use the crate-level `Stream` /
# `StreamExt` bounds directly).
futures = "0.3"

# Concurrency primitives
parking_lot = "0.12"

# Embedded key-value database (per-ticker order intent persistence)
redb = "2"

# Caching
lru = "0.12"

# Benchmarks (dev only)
criterion = { version = "0.5", features = ["html_reports"] }

# Dev harness: image encoding + perceptual diff for screenshots.
image = { version = "0.25", default-features = false, features = ["png"] }
image-compare = "0.4"

# ─── Workspace-wide profiles ──────────────────────────────────────────
[profile.dev]
opt-level = 1                   # Some optimization for GPU code in dev

[profile.dev.package."*"]
opt-level = 2                   # Full optimization for all dependencies

[profile.release]
opt-level = 3
lto = "fat"                     # Full link-time optimization
codegen-units = 1               # Maximum optimization, slower compile
strip = "symbols"               # Strip debug symbols from release binary
panic = "abort"                 # Smaller binary, no unwinding overhead

[profile.release-debug]
inherits = "release"
debug = true                    # Release perf with debug symbols for profiling
strip = "none"
