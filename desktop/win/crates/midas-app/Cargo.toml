[package]
name = "midas-app"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# Compile in the in-process dev harness: TCP listener, event log, fixture
# save/load, input injection. Zero cost when disabled — the `dev_harness`
# module and the `midas-devloop-proto` / `image` / `image-compare` deps
# are all feature-gated.
#
# S8d: also enables `midas-market-data/test_inject` so the harness's
# `InjectMarketEvent` command can reach
# `MarketDataRouter::source_for_test(..).inject_for_test(..)`.
dev_harness = [
    "dep:midas-devloop-proto",
    "dep:image",
    "dep:image-compare",
    "midas-market-data/test_inject",
]

# S8: Session-aware chart widget (vertical-slice proof). Opt-in. When
# disabled, the `session_chart` module is empty and the "New session
# chart" menu entry + `Message::OpenSessionChart` variant compile out.
# When enabled, the app gains a background command that boots the new
# midas-scene / midas-stream / midas-bars-adapter pipeline for a crypto
# M1 chart.
#
# See plan/session-aware-charts/00b-integration-strategy.md (Phase B,
# S8). Module-level docs on `src/session_chart/mod.rs` explain the MVP
# scope — the driver + scene pipeline is fully wired end-to-end, but
# rendering into a new iced window is deferred to S9 to keep the S8
# blast radius at zero on the existing chart surface.
session_chart = [
    "dep:midas-scene",
    "dep:midas-bars",
    "dep:midas-bars-adapter",
    "dep:midas-calendar",
    "dep:midas-clock",
    "dep:midas-stream",
    "dep:midas-axis",
]

[dependencies]
midas-core   = { path = "../midas-core" }
midas-data   = { path = "../midas-data" }
midas-chart  = { path = "../midas-chart" }
midas-annotation-types = { workspace = true }
midas-gpu-types = { workspace = true }
midas-render = { path = "../midas-render" }
midas-feed   = { path = "../midas-feed" }
midas-store  = { path = "../midas-store" }
midas-grid   = { path = "../midas-grid" }
midas-ui     = { path = "../midas-ui" }
mailbox_processor = { path = "../../../../crates/mailbox_processor" }
midas-devloop-proto = { path = "../midas-devloop-proto", optional = true }
image = { workspace = true, optional = true }
image-compare = { workspace = true, optional = true }

iced       = { workspace = true }
wgpu       = { workspace = true }
glam       = { workspace = true }
# `process` + `io-util` are opt-in features, needed by the dev-harness
# sim-child lifecycle (tokio::process::Command + AsyncReadExt) and
# released crates elsewhere in the workspace don't need them.
tokio      = { workspace = true, features = ["process", "io-util", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
crossbeam  = { workspace = true }
serde      = { workspace = true }
toml       = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow     = { workspace = true }
chrono     = { workspace = true }
dirs       = { workspace = true }
serde_json = { workspace = true }
uuid       = { version = "1", features = ["v7", "serde"] }
midas-broker = { workspace = true }
# Router refactor (S7): new crate that provides MarketDataRouter +
# SubscriptionHandle. The app subscribes to ticks / bars / quotes
# through these handles instead of the legacy BrokerEvent::Tick
# central match arm.
midas-market-data = { workspace = true }
midas-broker-core = { workspace = true }

# S8 (session_chart feature): Phase-A crates from the root workspace.
# All `optional = true`; the `session_chart` feature above opts them in.
midas-scene        = { workspace = true, optional = true }
midas-bars         = { workspace = true, optional = true }
midas-bars-adapter = { workspace = true, optional = true }
midas-calendar     = { workspace = true, optional = true }
midas-clock        = { workspace = true, optional = true }
midas-stream       = { workspace = true, optional = true }
midas-axis         = { workspace = true, optional = true }

async-trait  = { workspace = true }
futures      = { workspace = true }
# Concurrent map for the chart-subscription registry. The registry
# holds Arc<SubscriptionHandle<Bar>> keyed by (ChartId) so the
# `fn`-pointer-only closures required by `Subscription::run_with`
# can still reach per-instance state resolved at subscribe-time.
dashmap      = "6"
smallvec     = { workspace = true }
parking_lot  = { workspace = true }
thiserror    = { workspace = true }
redb         = { workspace = true }

[target.'cfg(unix)'.dependencies]
# libc::kill is called from the dev-harness sim_child shutdown path.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
