[package]
name = "midas-app"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
midas-core   = { path = "../midas-core" }
midas-data   = { path = "../midas-data" }
midas-chart  = { path = "../midas-chart" }
midas-render = { path = "../midas-render" }
midas-feed   = { path = "../midas-feed" }
midas-store  = { path = "../midas-store" }
midas-grid   = { path = "../midas-grid" }

iced       = { workspace = true }
wgpu       = { workspace = true }
tokio      = { workspace = true }
crossbeam  = { workspace = true }
serde      = { workspace = true }
toml       = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow     = { workspace = true }
chrono     = { workspace = true }
dirs       = { workspace = true }
serde_json = { workspace = true }
uuid       = { version = "1", features = ["v7", "serde"] }
midas-broker = { workspace = true }
