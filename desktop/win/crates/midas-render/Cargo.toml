[package]
name = "midas-render"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
midas-core      = { path = "../midas-core" }
midas-data      = { path = "../midas-data" }
midas-chart     = { path = "../midas-chart" }
midas-gpu-types = { workspace = true }

wgpu      = { workspace = true }
bytemuck  = { workspace = true }
glam      = { workspace = true }
ab_glyph  = { workspace = true }
etagere   = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }
# cryoglyph is iced 0.14's fork of glyphon, pinned to the same wgpu
# version as iced_wgpu (already transitively in Cargo.lock). Using it
# directly lets us render text in the same render pass as the SDF
# badge pipeline, so per-element z-order works without layer-split hacks.
cryoglyph = "0.1"

[dev-dependencies]
criterion = { workspace = true }
winit     = "0.30"
pollster  = "0.3"
# PNG encoding for the sparkline_demo example + smoke test readback.
png       = "0.17"

[[bench]]
name = "render_bench"
harness = false
