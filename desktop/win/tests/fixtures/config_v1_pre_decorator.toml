# Pre-Slice-7 TOML fixture used by
# `level_store_loads_v1_config_toml_fixture`.
#
# This mirrors the flat `LevelConfig` shape that the app wrote to
# `data/config.toml` prior to the decorator-system rewrite. The on-disk
# `LevelConfig` shape in `midas-core::config` was NOT changed by Slice
# 7 — the migration surface is only the `HorizontalLevel` struct —
# but the fixture is kept around as a regression guard so that
# `LevelStore::from_config` keeps reconstructing the decorator-composed
# `HorizontalLevel` from this legacy flat shape without drift.

